  default_prompt: "使用 $xiaohongshu-topic-shortlist-free。根据我提供的关键词、受众和 browserId，逐条阅读最多10张可见卡片的标题与摘要，按相关度和受众适配筛选最多5条；列出可见证据、来源、主题角度和缺项。"
